####################################################################################
# Description:                                                                     #
# This is the template policy for CFC IAM policy related operation task.           #
# Please update:                                                                   #
#     1, Change information                                                        #
#     2，Parameter Default value
#        *PolicyName; GroupName; Developer; CodeReviewer
#     3, Each resource's description                                               #                           
#     4, Update Policy detail                                                      #
#     5, Update Output                                                             #
####################################################################################

#Update 1: please update the change information
  #CR: ____________
  #Change request purpose: __________________________________________________________
  #__________________________________________________________________________________
AWSTemplateFormatVersion: '2010-09-09'
Description: Lilly China Operatoin Code for IAM Policy
# Update 2: Parameter descirption and default value
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Policy and Group Info.
        Parameters:
          - pPolicyName
          - pGroupName
      -
        Label:
          default: Developer and Reviwer
        Parameters:
          - pDeveloper
          - pReviewer

Parameters:
  pPolicyName:
    Description: Please add the impact Policy name
    Type: String
    #Update 2: please update the policy default name
    Default: ""
  pGroupName:
    Description: Please add the Group Name, Support multiple groups
    Type: CommaDelimitedList
    #Update 2: please update the group name, multiple groups shall be split by ","
    Default: ""
  pExistingIAMRoleName:
    Description: Pls add an existing IAM Role Name
    Type: String
    #Update 2: please update the Role name 
    Default: ""
  pDeveloper:
    Description: Code developer
    Type: String
    #Update 2: please add your name
    Default: Jack.Shen
    AllowedValues: 
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer: 
    Description: Code Reviewer
    Type: String
    #Update 2: please add the reviwer name in below
    Default: Simon.Xu
    AllowedValues: 
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Resources:
  rIAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # Update 3: please update resource description
      Description: "IAM Policy for IAM Role & Group "
      ManagedPolicyName: !Ref pPolicyName
      Path: "/"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Update 4: pleae update the Sid according the policy purpose
          - Sid: AllowToAttachOrUpdateTheGroupAndRolePolicy
            #Update 4: please update the Effect and Actions
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:UpdateRole*
              - iam:DeleteRole*
              - ec2:*
            #Update 4: please specific the resource as much as possible
            Resource: '*'
      Groups:      # Attach New Policy to an existing IAM Group
        !Ref pGroupName
      Roles:       # Attach New Policy to an existing IAM Role
        - !Ref pExistingIAMRoleName

  







