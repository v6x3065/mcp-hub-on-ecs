####################################################################################
# Description:                                                                     #
# Bearer token shared by the aws-mcp ALB listener rules (generated by Secrets      #
# Manager, never stored in git). Rules resolve it with a dynamic reference:        #
#   {{resolve:secretsmanager:<pSecretName>:SecretString:token}}                    #
#                                                                                  #
# Please update:                                                                   #
#     1, Change information                                                        #
#     2, Parameter Default values                                                  #
#     3, Tag Parameter Default values (keep identical to standards/tags.yaml) #
####################################################################################
#Update 1: please update the change information
  #CR: ___NA_________
  #Change request purpose: ______aws-mcp: ALB bearer token secret____________
  #Developer: __Jack.Shen___________
  #Reviewer: __Simon.Xu___________
AWSTemplateFormatVersion: '2010-09-09'
Description: Lilly China CloudOps Code for aws-mcp Secrets Manager
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Secret Info.
        Parameters:
          - pSecretName
          - pTokenLength
      -
        Label:
          default: Upstream Stacks
        Parameters:
          - pKmsStackName
      -
        Label:
          default: Tags
        Parameters:
          - pApplNameTag
          - pAdminTeamTag
          - pApplicationCiTag
          - pPrimaryItContactTag
          - pSNOWRequestIdTag
          - pSystemOwnerTag
          - pSystemCustodianTag
          - pCostCenterTag
          - pMLPSTag
          - pEnvironmentTag
          - pDataClassificationTag
          - pBusinessAreaTag
          - pLevel1BusinessAreaTag
      -
        Label:
          default: Developer and Reviewer
        Parameters:
          - pDeveloper
          - pReviewer
#Update 2: please update all Parameter Default values
Parameters:
  pSecretName:
    Description: Name of the secret
    Type: String
    Default: "lly-nw-cloudops-awsmcp-d-sm-01"
  pTokenLength:
    Description: Length of the generated token
    Type: Number
    Default: 48
    MinValue: 32
    MaxValue: 128
  pKmsStackName:
    Description: Stack that exports the CMK (KeyArn)
    Type: String
    Default: "lly-nw-cloudops-awsmcp-d-kms-01"
#Update 3: please update Tag Parameter Default values
  pApplNameTag:
    Description: Application Name Tag Value
    Type: String
    Default: "aws-mcp"
  pAdminTeamTag:
    Description: Admin Team Tag Value
    Type: String
    Default: "GISS"
  pApplicationCiTag:
    Description: Application Ci Tag Value
    Type: String
    Default: "CI00000000000000"
  pPrimaryItContactTag:
    Description: Primary IT Contact Tag Value
    Type: String
    Default: "cn_it_infra_cloud_ops@lists.lilly.com"
  pSNOWRequestIdTag:
    Description: Snow Request Id Tag Value
    Type: String
    Default: "CHG3151871"
  pSystemOwnerTag:
    Description: System Owner Tag Value
    Type: String
    Default: "xu_ming_ming@lilly.com"
  pSystemCustodianTag:
    Description: SystemCustodian Tag Value
    Type: String
    Default: "shen_jun_jack@lilly.com"
  pCostCenterTag:
    Description: CostCenter Tag Value
    Type: String
    Default: "5205060"
  pMLPSTag:
    Description: MLPS Tag Value
    Type: String
    Default: "No"
  pEnvironmentTag:
    Description: Environment Tag Value
    Type: String
    Default: "DEV"
  pDataClassificationTag:
    Description: Data Classification Tag Value
    Type: String
    Default: "Yellow"
  pBusinessAreaTag:
    Description: Business Area Tag Value
    Type: String
    Default: "Commercial"
  pLevel1BusinessAreaTag:
    Description: Level 1 Business Area Tag Value
    Type: String
    Default: "IBU"
  pDeveloper:
    Description: Code developer
    Type: String
    Default: Jack.Shen
    AllowedValues:
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer:
    Description: Code Reviewer
    Type: String
    Default: Simon.Xu
    AllowedValues:
      - Nik.Ni
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Resources:
  rTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref pSecretName
      Description: Bearer token required by the aws-mcp ALB listener rules
      KmsKeyId:
        Fn::ImportValue: !Sub '${pKmsStackName}:KeyArn'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: token
        PasswordLength: !Ref pTokenLength
        ExcludePunctuation: true
      Tags:
        - Key: "Name"
          Value: !Ref pSecretName
        - Key: "ApplName"
          Value: !Ref pApplNameTag
        - Key: "AdminTeam"
          Value: !Ref pAdminTeamTag
        - Key: "ApplicationCi"
          Value: !Ref pApplicationCiTag
        - Key: "PrimaryItContact"
          Value: !Ref pPrimaryItContactTag
        - Key: "SNOWRequestId"
          Value: !Ref pSNOWRequestIdTag
        - Key: "SystemOwner"
          Value: !Ref pSystemOwnerTag
        - Key: "SystemCustodian"
          Value: !Ref pSystemCustodianTag
        - Key: "CostCenter"
          Value: !Ref pCostCenterTag
        - Key: "MLPS"
          Value: !Ref pMLPSTag
        - Key: "Environment"
          Value: !Ref pEnvironmentTag
        - Key: "DataClassification"
          Value: !Ref pDataClassificationTag
        - Key: "BusinessArea"
          Value: !Ref pBusinessAreaTag
        - Key: "Level1BusinessArea"
          Value: !Ref pLevel1BusinessAreaTag
Outputs:
  SecretArn:
    Description: ARN of the token secret
    Value: !Ref rTokenSecret
    Export:
      Name: !Sub ${AWS::StackName}:SecretArn
  SecretName:
    Description: Name of the token secret (used in dynamic references)
    Value: !Ref pSecretName
    Export:
      Name: !Sub ${AWS::StackName}:SecretName
  StackContact:
    Value: !Ref pDeveloper
