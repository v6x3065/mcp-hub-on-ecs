####################################################################################
# Description:                                                                     #
# Target group + listener rule of the aws-mcp MCP gateway (instance 00), the only  #
# public MCP entry:  https://<pHostHeader>/mcp  ->  target group (container port). #
# pAuthMode = jwt (default): the ALB validates the Entra ID access token           #
#   (signature, iss, exp, aud, scp) before forwarding; missing/invalid -> 401.     #
# pAuthMode = none: no authentication at the ALB (troubleshooting only).          #
# Target health checks go straight to the targets and are not subject to the rule. #
#                                                                                  #
# Please update:                                                                   #
#     1, Change information                                                        #
#     2, Parameter Default values                                                  #
#     3, Tag Parameter Default values (keep identical to standards/tags.yaml) #
####################################################################################
#Update 1: please update the change information
  #CR: ___NA_________
  #Change request purpose: ______aws-mcp: target group and routing for the MCP gateway (Entra ID JWT)____________
  #Developer: __Jack.Shen___________
  #Reviewer: __Simon.Xu___________
AWSTemplateFormatVersion: '2010-09-09'
Description: Lilly China CloudOps Code for aws-mcp Target Group (mcp-gateway)
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Target Group Info.
        Parameters:
          - pTargetGroupName
          - pVPC
          - pContainerPort
          - pHealthCheckPath
          - pHealthCheckMatcher
      -
        Label:
          default: Routing
        Parameters:
          - pHostHeader
          - pRulePriority
          - pAuthMode
      -
        Label:
          default: Entra ID JWT validation (pAuthMode = jwt)
        Parameters:
          - pJwksEndpoint
          - pJwtIssuer
          - pJwtAudience
          - pJwtScope
      -
        Label:
          default: Upstream Stacks
        Parameters:
          - pAlbStackName
      -
        Label:
          default: Tags
        Parameters:
          - pApplNameTag
          - pAdminTeamTag
          - pApplicationCiTag
          - pPrimaryItContactTag
          - pSNOWRequestIdTag
          - pSystemOwnerTag
          - pSystemCustodianTag
          - pCostCenterTag
          - pMLPSTag
          - pEnvironmentTag
          - pDataClassificationTag
          - pBusinessAreaTag
          - pLevel1BusinessAreaTag
      -
        Label:
          default: Developer and Reviewer
        Parameters:
          - pDeveloper
          - pReviewer
#Update 2: please update all Parameter Default values
Parameters:
  pTargetGroupName:
    Description: Name of the target group (max 32 characters)
    Type: String
    Default: "lly-nw-cloudops-awsmcp-d-tg-00"
  pVPC:
    Description: VPC ID (ChinaDevelopment-2VPC)
    Type: "AWS::EC2::VPC::Id"
    Default: "vpc-0c748129d3dc6da22"
  pContainerPort:
    Description: Container port
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  pHealthCheckPath:
    Description: Health check path on the container (no token required)
    Type: String
    Default: "/healthz"
  pHealthCheckMatcher:
    Description: HTTP codes treated as healthy
    Type: String
    Default: "200"
  pHostHeader:
    Description: Public host name of the MCP endpoint (Cloudflare record)
    Type: String
    Default: "clade.dev.lilly.cn"
  pRulePriority:
    Description: Priority of the forwarding rule (unique per listener)
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50000
  pAuthMode:
    Description: "jwt = ALB validates the Entra ID access token; none = no authentication (troubleshooting only)"
    Type: String
    Default: "jwt"
    AllowedValues:
      - "jwt"
      - "none"
  pJwksEndpoint:
    Description: Entra ID signing keys (JWKS) of the lilly.com tenant
    Type: String
    Default: "https://login.microsoftonline.com/18a59a81-eea8-4c30-948a-d8824cdc2580/discovery/v2.0/keys"
  pJwtIssuer:
    Description: Expected iss of v2 access tokens
    Type: String
    Default: "https://login.microsoftonline.com/18a59a81-eea8-4c30-948a-d8824cdc2580/v2.0"
  pJwtAudience:
    Description: Expected aud (Application (client) ID of AWS Cloud Resource Search Tool)
    Type: String
    Default: "96450fc2-2afc-4c1a-8758-10d43822a9a5"
  pJwtScope:
    Description: Delegated scope that must be present in scp
    Type: String
    Default: "mcp.access"
  pAlbStackName:
    Description: Stack that exports the HTTPS listener (HttpsListenerArn)
    Type: String
    Default: "lly-nw-cloudops-awsmcp-d-alb-01"
#Update 3: please update Tag Parameter Default values
  pApplNameTag:
    Description: Application Name Tag Value
    Type: String
    Default: "aws-mcp"
  pAdminTeamTag:
    Description: Admin Team Tag Value
    Type: String
    Default: "GISS"
  pApplicationCiTag:
    Description: Application Ci Tag Value
    Type: String
    Default: "CI00000000000000"
  pPrimaryItContactTag:
    Description: Primary IT Contact Tag Value
    Type: String
    Default: "cn_it_infra_cloud_ops@lists.lilly.com"
  pSNOWRequestIdTag:
    Description: Snow Request Id Tag Value
    Type: String
    Default: "CHG3151871"
  pSystemOwnerTag:
    Description: System Owner Tag Value
    Type: String
    Default: "xu_ming_ming@lilly.com"
  pSystemCustodianTag:
    Description: SystemCustodian Tag Value
    Type: String
    Default: "shen_jun_jack@lilly.com"
  pCostCenterTag:
    Description: CostCenter Tag Value
    Type: String
    Default: "5205060"
  pMLPSTag:
    Description: MLPS Tag Value
    Type: String
    Default: "No"
  pEnvironmentTag:
    Description: Environment Tag Value
    Type: String
    Default: "DEV"
  pDataClassificationTag:
    Description: Data Classification Tag Value
    Type: String
    Default: "Yellow"
  pBusinessAreaTag:
    Description: Business Area Tag Value
    Type: String
    Default: "Commercial"
  pLevel1BusinessAreaTag:
    Description: Level 1 Business Area Tag Value
    Type: String
    Default: "IBU"
  pDeveloper:
    Description: Code developer
    Type: String
    Default: Jack.Shen
    AllowedValues:
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer:
    Description: Code Reviewer
    Type: String
    Default: Simon.Xu
    AllowedValues:
      - Nik.Ni
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Conditions:
  cJwt: !Equals [!Ref pAuthMode, 'jwt']
Resources:
  rTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Ref pTargetGroupName
      TargetType: ip
      Protocol: HTTP
      Port: !Ref pContainerPort
      VpcId: !Ref pVPC
      HealthCheckPath: !Ref pHealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: !Ref pHealthCheckMatcher
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: "Name"
          Value: !Ref pTargetGroupName
        - Key: "ApplName"
          Value: !Ref pApplNameTag
        - Key: "AdminTeam"
          Value: !Ref pAdminTeamTag
        - Key: "ApplicationCi"
          Value: !Ref pApplicationCiTag
        - Key: "PrimaryItContact"
          Value: !Ref pPrimaryItContactTag
        - Key: "SNOWRequestId"
          Value: !Ref pSNOWRequestIdTag
        - Key: "SystemOwner"
          Value: !Ref pSystemOwnerTag
        - Key: "SystemCustodian"
          Value: !Ref pSystemCustodianTag
        - Key: "CostCenter"
          Value: !Ref pCostCenterTag
        - Key: "MLPS"
          Value: !Ref pMLPSTag
        - Key: "Environment"
          Value: !Ref pEnvironmentTag
        - Key: "DataClassification"
          Value: !Ref pDataClassificationTag
        - Key: "BusinessArea"
          Value: !Ref pBusinessAreaTag
        - Key: "Level1BusinessArea"
          Value: !Ref pLevel1BusinessAreaTag
  rHttpsForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3002 # jwt-validation may not be in the cfn-lint schema yet; accepted by the service
            - E3030 # jwt-validation is not in the cfn-lint action type list yet; verified in cn-northwest-1
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub '${pAlbStackName}:HttpsListenerArn'
      Priority: !Ref pRulePriority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref pHostHeader
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /mcp
              - /mcp/*
      Actions: !If
        - cJwt
        - - Type: jwt-validation
            Order: 1
            JwtValidationConfig:
              JwksEndpoint: !Ref pJwksEndpoint
              Issuer: !Ref pJwtIssuer
              AdditionalClaims:
                - Name: aud
                  Format: single-string
                  Values:
                    - !Ref pJwtAudience
                - Name: scp
                  Format: space-separated-values
                  Values:
                    - !Ref pJwtScope
          - Type: forward
            Order: 2
            TargetGroupArn: !Ref rTargetGroup
        - - Type: forward
            TargetGroupArn: !Ref rTargetGroup
Outputs:
  TargetGroupArn:
    Description: ARN of the target group
    Value: !Ref rTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}:TargetGroupArn
  McpUrl:
    Description: MCP server URL for Copilot Studio
    Value: !Sub 'https://${pHostHeader}/mcp'
    Export:
      Name: !Sub ${AWS::StackName}:McpUrl
  AuthMode:
    Value: !Ref pAuthMode
    Export:
      Name: !Sub ${AWS::StackName}:AuthMode
  StackContact:
    Value: !Ref pDeveloper
