####################################################################################
# Description:                                                                     #
# Managed policy of the ECS task role (runtime identity of the MCP servers):       #
#   - may only assume the approved read-only role in the target account            #
#   - explicit deny on data-plane reads (secrets, object content, item data, ...)  #
# Keep the deny list in sync with the target-account read-only policy stack.       #
#                                                                                  #
# Please update:                                                                   #
#     1, Change information                                                        #
#     2, Parameter Default values                                                  #
#     3, Tag Parameter Default values (keep identical to standards/tags.yaml) #
####################################################################################
#Update 1: please update the change information
  #CR: ___NA_________
  #Change request purpose: ______aws-mcp: ECS task runtime policy____________
  #Developer: __Jack.Shen___________
  #Reviewer: __Simon.Xu___________
AWSTemplateFormatVersion: '2010-09-09'
Description: Lilly China CloudOps Code for aws-mcp IAM Policy
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Policy Info.
        Parameters:
          - pPolicyName
          - pTargetAccountId
          - pTargetRoleName
      -
        Label:
          default: Tags
        Parameters:
          - pApplNameTag
          - pAdminTeamTag
          - pApplicationCiTag
          - pPrimaryItContactTag
          - pSNOWRequestIdTag
          - pSystemOwnerTag
          - pSystemCustodianTag
          - pCostCenterTag
          - pMLPSTag
          - pEnvironmentTag
          - pDataClassificationTag
          - pBusinessAreaTag
          - pLevel1BusinessAreaTag
      -
        Label:
          default: Developer and Reviewer
        Parameters:
          - pDeveloper
          - pReviewer
#Update 2: please update all Parameter Default values
Parameters:
  pPolicyName:
    Description: Name of the managed policy
    Type: String
    Default: "lly-nw-cloudops-awsmcp-ecs-task-d-iamp-01"
  pTargetAccountId:
    Description: Pilot target account whose read-only role may be assumed (NA = no cross-account access)
    Type: String
    Default: "NA"
  pTargetRoleName:
    Description: Name of the read-only role in the target account (same name in every target account)
    Type: String
    Default: "lly-nw-cloudops-awsmcp-target-ro-d-iamr-01"
#Update 3: please update Tag Parameter Default values
  pApplNameTag:
    Description: Application Name Tag Value
    Type: String
    Default: "aws-mcp"
  pAdminTeamTag:
    Description: Admin Team Tag Value
    Type: String
    Default: "GISS"
  pApplicationCiTag:
    Description: Application Ci Tag Value
    Type: String
    Default: "CI00000000000000"
  pPrimaryItContactTag:
    Description: Primary IT Contact Tag Value
    Type: String
    Default: "cn_it_infra_cloud_ops@lists.lilly.com"
  pSNOWRequestIdTag:
    Description: Snow Request Id Tag Value
    Type: String
    Default: "NA"
  pSystemOwnerTag:
    Description: System Owner Tag Value
    Type: String
    Default: "xu_ming_ming@lilly.com"
  pSystemCustodianTag:
    Description: SystemCustodian Tag Value
    Type: String
    Default: "shen_jun_jack@lilly.com"
  pCostCenterTag:
    Description: CostCenter Tag Value
    Type: String
    Default: "5205060"
  pMLPSTag:
    Description: MLPS Tag Value
    Type: String
    Default: "No"
  pEnvironmentTag:
    Description: Environment Tag Value
    Type: String
    Default: "DEV"
  pDataClassificationTag:
    Description: Data Classification Tag Value
    Type: String
    Default: "Yellow"
  pBusinessAreaTag:
    Description: Business Area Tag Value
    Type: String
    Default: "Commercial"
  pLevel1BusinessAreaTag:
    Description: Level 1 Business Area Tag Value
    Type: String
    Default: "IBU"
  pDeveloper:
    Description: Code developer
    Type: String
    Default: Jack.Shen
    AllowedValues:
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer:
    Description: Code Reviewer
    Type: String
    Default: Simon.Xu
    AllowedValues:
      - Nik.Ni
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Conditions:
  cHasTargetAccount: !Not [!Equals [!Ref pTargetAccountId, 'NA']]
Resources:
  rIAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref pPolicyName
      Description: aws-mcp ECS task runtime (assume target read-only role, deny data reads)
      Path: "/"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - cHasTargetAccount
            - Sid: AssumeTargetReadOnlyRole
              Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub arn:${AWS::Partition}:iam::${pTargetAccountId}:role/${pTargetRoleName}
            - !Ref AWS::NoValue
          - Sid: DenyDataPlaneReads
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - kms:Decrypt
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - sqs:ReceiveMessage
              - kinesis:GetRecords
              - athena:GetQueryResults
              - lambda:GetFunction
              - lambda:GetLayerVersion
              - ecr:GetAuthorizationToken
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: '*'
Outputs:
  PolicyArn:
    Description: ARN of the task runtime policy
    Value: !Ref rIAMPolicy
    Export:
      Name: !Sub ${AWS::StackName}:PolicyArn
  StackContact:
    Value: !Ref pDeveloper
