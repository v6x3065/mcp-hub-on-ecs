####################################################################################
# Description:                                                                     #
# Managed policy of the ECS task execution role: pull images from the aws-mcp ECR  #
# repositories, write to the aws-mcp log groups, decrypt with the aws-mcp CMK.     #
#                                                                                  #
# Please update:                                                                   #
#     1, Change information                                                        #
#     2, Parameter Default values                                                  #
#     3, Tag Parameter Default values (keep identical to infra/standards/tags.yaml) #
####################################################################################
#Update 1: please update the change information
  #CR: ___NA_________
  #Change request purpose: ______aws-mcp: ECS task execution policy____________
  #Developer: __Jack.Shen___________
  #Reviewer: __Simon.Xu___________
AWSTemplateFormatVersion: '2010-09-09'
Description: Lilly China CloudOps Code for aws-mcp IAM Policy
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Policy Info.
        Parameters:
          - pPolicyName
          - pEcrRepositoryPrefix
          - pLogGroupPrefix
      -
        Label:
          default: Upstream Stacks
        Parameters:
          - pKmsStackName
      -
        Label:
          default: Tags
        Parameters:
          - pApplNameTag
          - pAdminTeamTag
          - pApplicationCiTag
          - pPrimaryItContactTag
          - pSNOWRequestIdTag
          - pSystemOwnerTag
          - pSystemCustodianTag
          - pCostCenterTag
          - pMLPSTag
          - pEnvironmentTag
          - pDataClassificationTag
          - pBusinessAreaTag
          - pLevel1BusinessAreaTag
      -
        Label:
          default: Developer and Reviewer
        Parameters:
          - pDeveloper
          - pReviewer
#Update 2: please update all Parameter Default values
Parameters:
  pPolicyName:
    Description: Name of the managed policy
    Type: String
    Default: "lly-nw-cloudops-awsmcp-ecs-exec-d-iamp-01"
  pEcrRepositoryPrefix:
    Description: Name prefix of the ECR repositories the task may pull from
    Type: String
    Default: "lly-nw-cloudops-awsmcp-"
  pLogGroupPrefix:
    Description: Name prefix of the log groups the task may write to
    Type: String
    Default: "/aws/ecs/lly-nw-cloudops-awsmcp-"
  pKmsStackName:
    Description: Stack that exports the CMK (KeyArn)
    Type: String
    Default: "lly-nw-cloudops-awsmcp-d-kms-01"
#Update 3: please update Tag Parameter Default values
  pApplNameTag:
    Description: Application Name Tag Value
    Type: String
    Default: "aws-mcp"
  pAdminTeamTag:
    Description: Admin Team Tag Value
    Type: String
    Default: "GISS"
  pApplicationCiTag:
    Description: Application Ci Tag Value
    Type: String
    Default: "CI00000000000000"
  pPrimaryItContactTag:
    Description: Primary IT Contact Tag Value
    Type: String
    Default: "cn_it_infra_cloud_ops@lists.lilly.com"
  pSNOWRequestIdTag:
    Description: Snow Request Id Tag Value
    Type: String
    Default: "NA"
  pSystemOwnerTag:
    Description: System Owner Tag Value
    Type: String
    Default: "xu_ming_ming@lilly.com"
  pSystemCustodianTag:
    Description: SystemCustodian Tag Value
    Type: String
    Default: "shen_jun_jack@lilly.com"
  pCostCenterTag:
    Description: CostCenter Tag Value
    Type: String
    Default: "5205060"
  pMLPSTag:
    Description: MLPS Tag Value
    Type: String
    Default: "No"
  pEnvironmentTag:
    Description: Environment Tag Value
    Type: String
    Default: "DEV"
  pDataClassificationTag:
    Description: Data Classification Tag Value
    Type: String
    Default: "Yellow"
  pBusinessAreaTag:
    Description: Business Area Tag Value
    Type: String
    Default: "Commercial"
  pLevel1BusinessAreaTag:
    Description: Level 1 Business Area Tag Value
    Type: String
    Default: "IBU"
  pDeveloper:
    Description: Code developer
    Type: String
    Default: Jack.Shen
    AllowedValues:
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer:
    Description: Code Reviewer
    Type: String
    Default: Simon.Xu
    AllowedValues:
      - Nik.Ni
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Resources:
  rIAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref pPolicyName
      Description: aws-mcp ECS task execution (image pull, log delivery)
      Path: "/"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcrAuthorization
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPullAwsMcpRepositories
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${pEcrRepositoryPrefix}*
          - Sid: LogsWriteAwsMcpLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${pLogGroupPrefix}*:*
          - Sid: KmsDecryptAwsMcpKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              Fn::ImportValue: !Sub '${pKmsStackName}:KeyArn'
Outputs:
  PolicyArn:
    Description: ARN of the task execution policy
    Value: !Ref rIAMPolicy
    Export:
      Name: !Sub ${AWS::StackName}:PolicyArn
  StackContact:
    Value: !Ref pDeveloper
