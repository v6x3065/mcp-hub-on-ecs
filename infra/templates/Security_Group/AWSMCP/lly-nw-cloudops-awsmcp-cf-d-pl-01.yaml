####################################################################################
# Description:                                                                     #
# Managed prefix list with the Cloudflare origin-facing IPv4 ranges. Referenced by #
# the ALB security group so only Cloudflare can reach the aws-mcp ALB.             #
# Source: https://www.cloudflare.com/ips-v4 (confirm with the Cloudflare team).    #
#                                                                                  #
# Please update:                                                                   #
#     1, Change information                                                        #
#     2, Parameter Default values / Entries                                        #
#     3, Tag Parameter Default values (keep identical to infra/standards/tags.yaml) #
####################################################################################
#Update 1: please update the change information
  #CR: ___NA_________
  #Change request purpose: ______aws-mcp: Cloudflare origin prefix list____________
  #Developer: __Jack.Shen___________
  #Reviewer: __Simon.Xu___________
AWSTemplateFormatVersion: '2010-09-09'
Description: Lilly China CloudOps Code for aws-mcp Prefix List
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Prefix List Info.
        Parameters:
          - pPrefixListName
          - pMaxEntries
      -
        Label:
          default: Tags
        Parameters:
          - pApplNameTag
          - pAdminTeamTag
          - pApplicationCiTag
          - pPrimaryItContactTag
          - pSNOWRequestIdTag
          - pSystemOwnerTag
          - pSystemCustodianTag
          - pCostCenterTag
          - pMLPSTag
          - pEnvironmentTag
          - pDataClassificationTag
          - pBusinessAreaTag
          - pLevel1BusinessAreaTag
      -
        Label:
          default: Developer and Reviewer
        Parameters:
          - pDeveloper
          - pReviewer
#Update 2: please update all Parameter Default values
Parameters:
  pPrefixListName:
    Description: Name of the prefix list
    Type: String
    Default: "lly-nw-cloudops-awsmcp-cf-d-pl-01"
  pMaxEntries:
    Description: Maximum number of entries (counts against the security group rule quota)
    Type: Number
    Default: 20
    MinValue: 15
    MaxValue: 50
#Update 3: please update Tag Parameter Default values
  pApplNameTag:
    Description: Application Name Tag Value
    Type: String
    Default: "aws-mcp"
  pAdminTeamTag:
    Description: Admin Team Tag Value
    Type: String
    Default: "GISS"
  pApplicationCiTag:
    Description: Application Ci Tag Value
    Type: String
    Default: "CI00000000000000"
  pPrimaryItContactTag:
    Description: Primary IT Contact Tag Value
    Type: String
    Default: "cn_it_infra_cloud_ops@lists.lilly.com"
  pSNOWRequestIdTag:
    Description: Snow Request Id Tag Value
    Type: String
    Default: "NA"
  pSystemOwnerTag:
    Description: System Owner Tag Value
    Type: String
    Default: "xu_ming_ming@lilly.com"
  pSystemCustodianTag:
    Description: SystemCustodian Tag Value
    Type: String
    Default: "shen_jun_jack@lilly.com"
  pCostCenterTag:
    Description: CostCenter Tag Value
    Type: String
    Default: "5205060"
  pMLPSTag:
    Description: MLPS Tag Value
    Type: String
    Default: "No"
  pEnvironmentTag:
    Description: Environment Tag Value
    Type: String
    Default: "DEV"
  pDataClassificationTag:
    Description: Data Classification Tag Value
    Type: String
    Default: "Yellow"
  pBusinessAreaTag:
    Description: Business Area Tag Value
    Type: String
    Default: "Commercial"
  pLevel1BusinessAreaTag:
    Description: Level 1 Business Area Tag Value
    Type: String
    Default: "IBU"
  pDeveloper:
    Description: Code developer
    Type: String
    Default: Jack.Shen
    AllowedValues:
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer:
    Description: Code Reviewer
    Type: String
    Default: Simon.Xu
    AllowedValues:
      - Nik.Ni
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Resources:
  rCloudflarePrefixList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: !Ref pPrefixListName
      AddressFamily: IPv4
      MaxEntries: !Ref pMaxEntries
      Entries:
        - { Cidr: 173.245.48.0/20, Description: Cloudflare }
        - { Cidr: 103.21.244.0/22, Description: Cloudflare }
        - { Cidr: 103.22.200.0/22, Description: Cloudflare }
        - { Cidr: 103.31.4.0/22, Description: Cloudflare }
        - { Cidr: 141.101.64.0/18, Description: Cloudflare }
        - { Cidr: 108.162.192.0/18, Description: Cloudflare }
        - { Cidr: 190.93.240.0/20, Description: Cloudflare }
        - { Cidr: 188.114.96.0/20, Description: Cloudflare }
        - { Cidr: 197.234.240.0/22, Description: Cloudflare }
        - { Cidr: 198.41.128.0/17, Description: Cloudflare }
        - { Cidr: 162.158.0.0/15, Description: Cloudflare }
        - { Cidr: 104.16.0.0/13, Description: Cloudflare }
        - { Cidr: 104.24.0.0/14, Description: Cloudflare }
        - { Cidr: 172.64.0.0/13, Description: Cloudflare }
        - { Cidr: 131.0.72.0/22, Description: Cloudflare }
      Tags:
        - Key: "Name"
          Value: !Ref pPrefixListName
        - Key: "ApplName"
          Value: !Ref pApplNameTag
        - Key: "AdminTeam"
          Value: !Ref pAdminTeamTag
        - Key: "ApplicationCi"
          Value: !Ref pApplicationCiTag
        - Key: "PrimaryItContact"
          Value: !Ref pPrimaryItContactTag
        - Key: "SNOWRequestId"
          Value: !Ref pSNOWRequestIdTag
        - Key: "SystemOwner"
          Value: !Ref pSystemOwnerTag
        - Key: "SystemCustodian"
          Value: !Ref pSystemCustodianTag
        - Key: "CostCenter"
          Value: !Ref pCostCenterTag
        - Key: "MLPS"
          Value: !Ref pMLPSTag
        - Key: "Environment"
          Value: !Ref pEnvironmentTag
        - Key: "DataClassification"
          Value: !Ref pDataClassificationTag
        - Key: "BusinessArea"
          Value: !Ref pBusinessAreaTag
        - Key: "Level1BusinessArea"
          Value: !Ref pLevel1BusinessAreaTag
Outputs:
  PrefixListId:
    Description: ID of the Cloudflare prefix list
    Value: !Ref rCloudflarePrefixList
    Export:
      Name: !Sub ${AWS::StackName}:PrefixListId
  PrefixListArn:
    Description: ARN of the Cloudflare prefix list
    Value: !GetAtt rCloudflarePrefixList.Arn
    Export:
      Name: !Sub ${AWS::StackName}:PrefixListArn
  StackContact:
    Value: !Ref pDeveloper
