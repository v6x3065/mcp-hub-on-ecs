  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: KMS Info.
        Parameters:
          - pKMSKeyAlias
          - pKeyAdminRoleName1
          - pKeyAdminRoleName2
      -
        Label:
          default: Tags
        Parameters:
          - pApplNameTag
          - pAdminTeamTag
          - pApplicationCiTag
          - pPrimaryItContactTag
          - pSNOWRequestIdTag
          - pSystemOwnerTag
          - pSystemCustodianTag
          - pCostCenterTag
          - pMLPSTag
          - pEnvironmentTag
          - pDataClassificationTag
          - pBusinessAreaTag
          - pLevel1BusinessAreaTag
      -
        Label:
          default: Developer and Reviewer
        Parameters:
          - pDeveloper
          - pReviewer
#Update 2: please update all Parameter Default values
Parameters:
  pKMSKeyAlias:
    Description: Alias of the KMS Key (without the alias/ prefix)
    Type: String
    Default: "lly-nw-cloudops-awsmcp-d-kms-01"
  pKeyAdminRoleName1:
    Description: Role allowed to administer the key
    Type: String
    Default: "awscn_global_admins"
  pKeyAdminRoleName2:
    Description: Role allowed to administer the key
    Type: String
    Default: "LillyChinaOrganizationAccountAccessRole"
#Update 3: please update Tag Parameter Default values
  pApplNameTag:
    Description: Application Name Tag Value
    Type: String
    Default: "aws-mcp"
  pAdminTeamTag:
    Description: Admin Team Tag Value
    Type: String
    Default: "GISS"
  pApplicationCiTag:
    Description: Application Ci Tag Value
    Type: String
    Default: "CI00000000000000"
  pPrimaryItContactTag:
    Description: Primary IT Contact Tag Value
    Type: String
    Default: "cn_it_infra_cloud_ops@lists.lilly.com"
  pSNOWRequestIdTag:
    Description: Snow Request Id Tag Value
    Type: String
    Default: "NA"
  pSystemOwnerTag:
    Description: System Owner Tag Value
    Type: String
    Default: "xu_ming_ming@lilly.com"
  pSystemCustodianTag:
    Description: SystemCustodian Tag Value
    Type: String
    Default: "shen_jun_jack@lilly.com"
  pCostCenterTag:
    Description: CostCenter Tag Value
    Type: String
    Default: "5205060"
  pMLPSTag:
    Description: MLPS Tag Value
    Type: String
    Default: "No"
  pEnvironmentTag:
    Description: Environment Tag Value
    Type: String
    Default: "DEV"
  pDataClassificationTag:
    Description: Data Classification Tag Value
    Type: String
    Default: "Yellow"
  pBusinessAreaTag:
    Description: Business Area Tag Value
    Type: String
    Default: "Commercial"
  pLevel1BusinessAreaTag:
    Description: Level 1 Business Area Tag Value
    Type: String
    Default: "IBU"
  pDeveloper:
    Description: Code developer
    Type: String
    Default: Jack.Shen
    AllowedValues:
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
  pReviewer:
    Description: Code Reviewer
    Type: String
    Default: Simon.Xu
    AllowedValues:
      - Nik.Ni
      - Green.Huang
      - Simon.Xu
      - Jack.Shen
      - Guoshu.Wan
      - Robin.Zhong
Resources:
  rAppKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CMK for aws-mcp (ECR, CloudWatch Logs, Secrets Manager)
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: key-1
        Statement:
          # Account root: lets IAM policies (task/exec roles, CI role) grant use of the key
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS:
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${pKeyAdminRoleName1}
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${pKeyAdminRoleName2}
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
            Resource: '*'
          - Sid: AllowCloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.${AWS::URLSuffix}
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
      Tags:
        - Key: "Name"
          Value: !Ref pKMSKeyAlias
        - Key: "ApplName"
          Value: !Ref pApplNameTag
        - Key: "AdminTeam"
          Value: !Ref pAdminTeamTag
        - Key: "ApplicationCi"
          Value: !Ref pApplicationCiTag
        - Key: "PrimaryItContact"
          Value: !Ref pPrimaryItContactTag
        - Key: "SNOWRequestId"
          Value: !Ref pSNOWRequestIdTag
        - Key: "SystemOwner"
          Value: !Ref pSystemOwnerTag
        - Key: "SystemCustodian"
          Value: !Ref pSystemCustodianTag
        - Key: "CostCenter"
          Value: !Ref pCostCenterTag
        - Key: "MLPS"
          Value: !Ref pMLPSTag
        - Key: "Environment"
          Value: !Ref pEnvironmentTag
        - Key: "DataClassification"
          Value: !Ref pDataClassificationTag
        - Key: "BusinessArea"
          Value: !Ref pBusinessAreaTag
        - Key: "Level1BusinessArea"
          Value: !Ref pLevel1BusinessAreaTag
  rAppKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${pKMSKeyAlias}
      TargetKeyId: !Ref rAppKMSKey
Outputs:
  KeyArn:
    Description: ARN of the CMK
    Value: !GetAtt rAppKMSKey.Arn
    Export:
      Name: !Sub ${AWS::StackName}:KeyArn
  KeyId:
    Description: ID of the CMK
    Value: !Ref rAppKMSKey
    Export:
      Name: !Sub ${AWS::StackName}:KeyId
  AliasName:
    Description: Alias of the CMK
    Value: !Ref rAppKMSKeyAlias
    Export:
      Name: !Sub ${AWS::StackName}:AliasName
  StackContact:
    Value: !Ref pDeveloper
