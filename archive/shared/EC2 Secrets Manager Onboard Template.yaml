AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager for EC2 Password Rotation
Parameters:
  pIAMUserName:
    Description: IAM User name 
    Type: String
    Default: ""
  pEC2InstanceID:
    Description: EC2 Instance ID 
    Type: String
    Default: ""
  pEC2UserName:
    Description: The EC2 Windows Users Account
    Type: String
    Default: ""
  pLambdaTaskRole:
    Type: String
    Default: ""
Resources:
  rEC2SecretsManagerKey:                  # EC2 Windows User Secrets Key Creation
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name:  !Join [ '/', [ !Ref pEC2InstanceID, !Ref pEC2UserName]]
      Description: This key password will be automatically rotated by the EC2 Lambda  password generation fucntion.
      SecretString: '{"password":""}'
      Tags:
        - 
          Key: "ResetPassword"
          Value: "True"

  rEC2SecretResourcePolicy:    
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      BlockPublicPolicy: True
      SecretId:
        Ref: rEC2SecretsManagerKey
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
        -
          Resource:                      # Deny All Users Permission to update Secrets Key resources Permission excepted the cloud ops team & EC2 Lamabda Role
            - Ref: rEC2SecretsManagerKey
          Action:
            - secretsmanager:*Resource*    
          Effect: Deny                          
          Principal: "*"
          Condition:
            ArnNotEquals:
              aws:PrincipalArn:
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:root"
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:user/L014759-dev"   
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:user/C267475-dev" 
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:user/V6X3065-dev"     
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:user/C291398-dev"    
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:role/${pLambdaTaskRole}"
            BoolIfExists:
              aws:PrincipalIsAWSService: 'false'
        -
          Resource: 
            - Ref: rEC2SecretsManagerKey          # Deny All Users Permission to get User Secrets Key excepts the Dedicated IAM Users 
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret           
          Effect: Deny
          Principal: "*"
          Condition:
            ArnNotEquals:
              aws:PrincipalArn: 
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:root"
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:user/${pIAMUserName}" 
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:role/${pLambdaTaskRole}"
            BoolIfExists:
              aws:PrincipalIsAWSService: 'false'
        -
          Resource:          # Deny all IAM users permission to put key vlaue excepted the EC2 Lambda Role
            - Ref: rEC2SecretsManagerKey
          Action:
            - secretsmanager:PutSecretValue   
          Effect: Deny
          Principal: "*"
          Condition:
            ArnNotEquals:
              aws:PrincipalArn: 
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:role/${pLambdaTaskRole}"
            BoolIfExists:
              aws:PrincipalIsAWSService: 'false'
        -
          Resource:       # Only Allow Dedicated  IAM users permission to get secrets value
            - Ref: rEC2SecretsManagerKey
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret          
          Effect: Allow
          Principal: 
            AWS:
              - !Sub "arn:aws-cn:iam::${AWS::AccountId}:user/${pIAMUserName}"