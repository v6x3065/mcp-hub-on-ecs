name: Build aws-mcp image

# Builds one MCP server image from the fork, pushes it to the ECR repository owned by the
# ECR stacks and prints the tag to put into pImageTag of the matching ecssvc template.
# The pipeline never deploys: release = PR changing pImageTag (and pDesiredCount, first time).

on:
  workflow_dispatch:
    inputs:
      service:
        description: MCP server to build
        required: true
        type: choice
        options:
          - aws-api
          - aws-doc
          - mcp-gateway
      repo_url:
        description: Fork repository (aws-api / aws-doc only)
        required: true
        default: https://github.com/mengchencloud/mcp.git
        type: string
      ref:
        description: Branch or tag of the fork (aws-api / aws-doc only; the resolved commit SHA becomes the image tag)
        required: true
        default: feat/cross-account-support
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: cn-northwest-1
  # Role created by lly-nw-cloudops-awsmcp-github-action-d-iamr-01 (dev2)
  AWS_ROLE_ARN: arn:aws-cn:iam::820607692027:role/lly-nw-cloudops-awsmcp-github-action-d-iamr-01
  ECR_REGISTRY: 820607692027.dkr.ecr.cn-northwest-1.amazonaws.com.cn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve service settings
        id: svc
        run: |
          case "${{ inputs.service }}" in
            aws-api) echo "repo=lly-nw-cloudops-awsmcp-d-ecr-01" >> "$GITHUB_OUTPUT"
                     echo "context=mcp/src/aws-api-mcp-server" >> "$GITHUB_OUTPUT"
                     echo "template=ecssvc-01" >> "$GITHUB_OUTPUT" ;;
            aws-doc) echo "repo=lly-nw-cloudops-awsmcp-d-ecr-02" >> "$GITHUB_OUTPUT"
                     echo "context=mcp/src/aws-documentation-mcp-server" >> "$GITHUB_OUTPUT"
                     echo "template=ecssvc-02" >> "$GITHUB_OUTPUT" ;;
            mcp-gateway) echo "repo=lly-nw-cloudops-awsmcp-d-ecr-00" >> "$GITHUB_OUTPUT"
                     echo "context=mcp-gateway" >> "$GITHUB_OUTPUT"
                     echo "template=ecssvc-00" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Clone fork
        if: inputs.service != 'mcp-gateway'
        run: git clone --depth 1 -b "${{ inputs.ref }}" "${{ inputs.repo_url }}" mcp

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ inputs.service }}" = "mcp-gateway" ]; then
            echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git -C mcp rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: awsmcp-build-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Smoke test gateway image
        if: inputs.service == 'mcp-gateway'
        run: |
          docker build --platform linux/amd64 -t gateway-test "${{ steps.svc.outputs.context }}"
          docker run -d --name gw -p 8000:8000 \
            -e MCP_BACKEND_AWS_API_URL=http://127.0.0.1:9/mcp \
            -e MCP_BACKEND_AWS_DOC_URL=http://127.0.0.1:9/mcp gateway-test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || true)
            [ "$code" = "200" ] && break; sleep 2
          done
          docker logs gw
          [ "$code" = "200" ] || { echo "healthz returned $code"; exit 1; }

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.svc.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ steps.svc.outputs.repo }}:${{ steps.tag.outputs.tag }}

      - name: Release instructions
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "\`${ECR_REGISTRY}/${{ steps.svc.outputs.repo }}:${{ steps.tag.outputs.tag }}\`"
            echo ""
            echo "Release: set \`pImageTag\` to \`${{ steps.tag.outputs.tag }}\` in"
            echo "\`templates/ECS/AWSMCP/lly-nw-cloudops-awsmcp-d-${{ steps.svc.outputs.template }}.yaml\`"
            echo "(first release also \`pDesiredCount\` >= 1) and open a PR."
          } >> "$GITHUB_STEP_SUMMARY"
